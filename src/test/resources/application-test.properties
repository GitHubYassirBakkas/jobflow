spring.application.name=jobflow-test

# Safety fallback only. Tests must receive the real datasource from Testcontainers.
spring.datasource.url=jdbc:postgresql://127.0.0.1:1/jobflow_test_must_be_overridden_by_testcontainers
spring.datasource.username=test
spring.datasource.password=test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=jobflow-test-only-secret-key-32-plus-bytes-never-use-in-production
jwt.expiration=3600
